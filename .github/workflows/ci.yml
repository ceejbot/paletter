name: CI

on:
    push:
        branches: [latest]
    pull_request:
        branches: [latest]

jobs:
    test:
        runs-on: macos-latest

        steps:
            - uses: actions/checkout@v4

            - name: Build
              run: swift build -v

            # - name: Run Tests
            #   run: swift test -v

            - name: Test CLI functionality
              run: |
                  swift build
                  # Test with fixtures directory
                  .build/debug/paletter fixtures
                  # Verify .clr files were created
                  ls -la fixtures/*.clr
