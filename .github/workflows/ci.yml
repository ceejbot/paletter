name: CI

on:
    push:
        branches: [latest]
        paths:
            - ".github/workflows/ci.yml"
            - ".swiftlint.yml"
            - "**/*.swift"
    pull_request:
        branches: [latest]
        paths:
            - ".github/workflows/ci.yml"
            - ".swiftlint.yml"
            - "**/*.swift"

jobs:
    test:
        runs-on: macos-latest

        steps:
            - uses: actions/checkout@v5

            - name: Build
              run: swift build -v

            - name: Run tests
              run: swift test -v

            - name: Test CLI functionality
              run: |
                  swift build
                  # Test with fixtures directory
                  .build/debug/paletter fixtures
                  # Verify .clr files were created
                  ls -la fixtures/*.clr
