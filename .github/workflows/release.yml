name: release
permissions:
    contents: write

on:
    push:
        tags:
            - "v**[0-9]+.[0-9]+.[0-9]+*"
    workflow_dispatch:
        inputs:
            ref_name:
                type: string
                description: the refname to build a release from
                default: "latest"

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    preflight:
        name: preflight
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - name: set ref_name
              shell: bash
              run: |
                  if [ -n "${{ inputs.ref_name }}" ]; then
                    echo "REF_NAME=${{ inputs.ref_name }}" >> $GITHUB_ENV
                  else
                    echo "REF_NAME=${{ github.ref_name }}" >> $GITHUB_ENV
                  fi

            - name: create github release
              continue-on-error: true # for testing
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  release_url=$(gh release create $REF_NAME --generate-notes)

    build-macos:
        runs-on: macos-latest
        steps:
            - uses: actions/checkout@v5

            - name: Build universal binary
              run: |
                  swift build -c release --arch arm64
                  swift build -c release --arch x86_64

                  mkdir -p dist
                  lipo -create \
                     .build/arm64-apple-macosx/release/paletter \
                     .build/x86_64-apple-macosx/release/paletter \
                     -output dist/paletter

            - name: build for release and upload
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  GITHUB_ACCESS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  cd dist
                  tar -czf paletter-universal-apple-darwin.tar.gz paletter
                  gh release upload "$REF_NAME" "paletter-universal-apple-darwin.tar.gz"

    postflight:
        name: postflight
        runs-on: ubuntu-latest
        needs:
            - build-macos
        steps:
            - uses: actions/checkout@v5

            - name: set ref_name
              shell: bash
              run: |
                  if [ -n "${{ inputs.ref_name }}" ]; then
                    echo "REF_NAME=${{ inputs.ref_name }}" >> $GITHUB_ENV
                  else
                    echo "REF_NAME=${{ github.ref_name }}" >> $GITHUB_ENV
                  fi

            - name: publish the draft release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              shell: bash
              run: gh release edit "$REF_NAME" --draft=false

            - name: update the homebrew tap
              env:
                  GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
                  GITHUB_ACCESS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              shell: bash
              run: |
                  .github/scripts/formula.sh "$REF_NAME"
                  gh repo clone ceejbot/homebrew-tap
                  cd homebrew-tap || exit 1
                  cp "../paletter.rb" Formula/
                  git add Formula/paletter.rb
                  git config user.name "formula robot"
                  git config user.email "ceejceej@gmail.com"
                  git commit -m "paletter $REF_NAME"
                  git push https://x-access-token:${{ secrets.HOMEBREW_TAP_TOKEN }}@github.com/ceejbot/homebrew-tap.git
